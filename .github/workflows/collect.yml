name: 데이터 수집

on:
  schedule:
    - cron: "47 23 * * *"   # 매일 08:47 KST (아침)
    - cron: "23 6 * * *"    # 매일 15:23 KST (오후)
    - cron: "37 14 * * *"   # 매일 23:37 KST (밤 마감 1차)
    - cron: "57 14 * * *"   # 매일 23:57 KST (밤 마감 2차 예비 — 같은 날 값 덮어쓰기라 안전)
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 수집 실행
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TZ: Asia/Seoul
        run: python3 collector.py

      - name: data.json 커밋
        run: |
          git config user.name "tym-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "변경 없음" || git commit -m "data: $(TZ=Asia/Seoul date +%F)"
          git push
